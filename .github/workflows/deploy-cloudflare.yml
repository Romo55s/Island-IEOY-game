name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy game Worker
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
      - name: Require explicit approval for remotely served user assets
        run: node scripts/check-deployment-approval.mjs
      - name: Validate Cloudflare deployment bundle
        run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Deploy Worker, static assets, and multiplayer Durable Object
        run: npx cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
